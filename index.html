<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>條碼、QR Code 與資訊組合產生器</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        /* 基礎樣式重置 */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        h2 { color: #34495e; font-size: 1.3em; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }

        /* 通用面板區塊樣式 */
        .panel { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 30px; 
        }

        /* 資訊組合器專用樣式 */
        .builder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 0.9em;
            font-weight: 600;
            color: #4a5568;
        }
        .sub-input-row {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .sub-input-row select {
            flex: 1;
        }
        .sub-input-row input {
            width: 70px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .preview-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 16px;
            color: #1e293b;
            margin-bottom: 15px;
            min-height: 60px;
        }
        .action-bar {
            display: flex;
            gap: 10px;
        }

        /* 控制面板區塊 (條碼/QR) */
        .control-panel { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
        }
        input[type="text"], select, button { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        input[type="text"] { 
            flex: 1; 
            border: 1px solid #ddd; 
            min-width: 200px;
        }
        select { background: #eee; outline: none; }
        button.add-btn { background: #10b981; color: white; font-weight: bold; }
        button.add-btn:hover { background: #059669; }
        button.copy-btn { background: #8b5cf6; color: white; font-weight: bold; flex: 1; }
        button.copy-btn:hover { background: #7c3aed; }

        /* 卡片顯示區域 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            animation: fadeIn 0.3s ease-in-out;
        }
        .card canvas { max-width: 100%; height: auto; background: white; padding: 10px; border-radius: 4px; }
        .text-display { 
            word-break: break-all; 
            color: #666; 
            font-size: 0.95em; 
            text-align: center; 
            width: 100%;
        }
        
        /* 卡片內按鈕區塊 */
        .card-actions { display: flex; gap: 10px; width: 100%; }
        .btn-download { flex: 1; background: #3b82f6; color: white; }
        .btn-download:hover { background: #2563eb; }
        .btn-remove { flex: 1; background: #ef4444; color: white; }
        .btn-remove:hover { background: #dc2626; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>條碼、QR Code 與資訊組合產生器</h1>
        
        <!-- 新增：批次資訊組合產生器 -->
        <div class="panel">
            <h2>📦 物流/回報資訊快速組合器</h2>
            <div class="builder-grid">
                <!-- 第一行 -->
                <div class="input-group">
                    <label>第一行：日期與地點</label>
                    <div class="sub-input-row">
                        <input type="text" id="dateInput" placeholder="日期" style="width: 80px;" />
                        <select id="locationSelect" style="flex: 1;">
                            <option value="潮州中洲">潮州中洲</option>
                            <option value="潮州光華">潮州光華</option>
                            <option value="潮州大同">潮州大同</option>
                            <option value="潮州光春">潮州光春</option>
                            <option value="潮州愛國">潮州愛國</option>
                            <option value="潮州四維">潮州四維</option>
                            <option value="潮州文化">潮州文化</option>
                            <option value="潮州延平">潮州延平</option>
                            <option value="潮州太平">潮州太平</option>
                            <option value="潮州新生">潮州新生</option>
                        </select>
                    </div>
                </div>

                <!-- 第二行 -->
                <div class="input-group">
                    <label>第二行：狀態一</label>
                    <div class="sub-input-row">
                        <select id="status1Select" onchange="handleSelectChange('status1', this.value)">
                            <option value="無">無</option>
                            <option value="滯留_箱">滯留箱</option>
                            <option value="滯留_箱_裸">滯留箱（含裸）</option>
                            <option value="無滯留">無滯留</option>
                            <option value="無到貨">無到貨</option>
                            <option value="無櫃位">無櫃位</option>
                            <option value="無合適櫃位">無合適櫃位</option>
                            <option value="束帶×">束帶×</option>
                            <option value="無束帶×">無束帶×</option>
                        </select>
                        <input type="text" id="status1_num1" placeholder="箱數" style="display:none;" />
                        <input type="text" id="status1_num2" placeholder="裸數" style="display:none;" />
                    </div>
                </div>

                <!-- 第三行 -->
                <div class="input-group">
                    <label>第三行：狀態二</label>
                    <div class="sub-input-row">
                        <select id="status2Select" onchange="handleSelectChange('status2', this.value)">
                            <option value="無">無</option>
                            <option value="滯留_箱">滯留箱</option>
                            <option value="滯留_箱_裸">滯留箱（含裸）</option>
                            <option value="無滯留">無滯留</option>
                            <option value="無到貨">無到貨</option>
                            <option value="無櫃位">無櫃位</option>
                            <option value="無合適櫃位">無合適櫃位</option>
                            <option value="束帶×">束帶×</option>
                            <option value="無束帶×">無束帶×</option>
                        </select>
                        <input type="text" id="status2_num1" placeholder="箱數" style="display:none;" />
                        <input type="text" id="status2_num2" placeholder="裸數" style="display:none;" />
                    </div>
                </div>
            </div>

            <label style="font-size: 0.9em; font-weight: 600; color: #4a5568; display: block; margin-bottom: 5px;">即時預覽結果：</label>
            <div class="preview-box" id="previewText"></div>

            <div class="action-bar">
                <button class="copy-btn" onclick="copyResult()">📋 複製文字結果</button>
            </div>
        </div>

        <!-- 原有：條碼與 QR Code 產生器 -->
        <div class="panel">
            <h2>🏷️ 條碼與 QR Code 產生器</h2>
            <div class="control-panel">
                <input type="text" id="inputValue" placeholder="請輸入任意值 (網址、文字、編號)..." />
                <select id="codeType">
                    <option value="qrcode">QR Code</option>
                    <option value="barcode">條碼 (Barcode)</option>
                </select>
                <button class="add-btn" onclick="generateCode()">新增產生</button>
            </div>
        </div>

        <div class="grid" id="codeGrid"></div>
    </div>

    <script>
        // 初始化自動帶出當天日期 (格式 M/D，如 7/29)
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            document.getElementById('dateInput').value = `${month}/${day}`;
            updatePreview();

            // 監聽所有輸入與下拉變動，自動即時更新預覽
            document.querySelectorAll('input, select').forEach(element => {
                element.addEventListener('input', updatePreview);
                element.addEventListener('change', updatePreview);
            });
        });

        // 處理動態出現的手動輸入框
        function handleSelectChange(prefix, value) {
            const num1Input = document.getElementById(`${prefix}_num1`);
            const num2Input = document.getElementById(`${prefix}_num2`);
            
            num1Input.style.display = 'none';
            num2Input.style.display = 'none';

            if (value === '滯留_箱') {
                num1Input.style.display = 'block';
                num1Input.placeholder = '箱數';
            } else if (value === '滯留_箱_裸') {
                num1Input.style.display = 'block';
                num1Input.placeholder = '箱數';
                num2Input.style.display = 'block';
                num2Input.placeholder = '裸數';
            } else if (value.includes('束帶×')) {
                num1Input.style.display = 'block';
                num1Input.placeholder = '數量';
            }
        }

        // 產生格式化文字
        function getFormattedText() {
            const date = document.getElementById('dateInput').value.trim();
            const location = document.getElementById('locationSelect').value;
            
            const line1 = `${date} ${location}`;
            const line2 = formatStatusText('status1');
            const line3 = formatStatusText('status2');

            let result = line1;
            if (line2) result += `\n${line2}`;
            if (line3) result += `\n${line3}`;
            return result;
        }

        function formatStatusText(prefix) {
            const selectVal = document.getElementById(`${prefix}Select`).value;
            const num1 = document.getElementById(`${prefix}_num1`).value.trim();
            const num2 = document.getElementById(`${prefix}_num2`).value.trim();

            if (selectVal === '無') return '';
            
            if (selectVal === '滯留_箱') {
                return `滯留${num1 || '___'}箱`;
            } else if (selectVal === '滯留_箱_裸') {
                return `滯留${num1 || '___'}箱${num2 || '___'}裸`;
            } else if (selectVal.includes('束帶×')) {
                return `${selectVal}${num1 || '___'}`;
            }
            return selectVal;
        }

        function updatePreview() {
            document.getElementById('previewText').textContent = getFormattedText();
        }

        function copyResult() {
            const text = getFormattedText();
            navigator.clipboard.writeText(text).then(() => {
                alert('已成功複製文字至剪貼簿！');
            }).catch(err => {
                alert('複製失敗，請手動複製。');
            });
        }

        // 條碼與 QR Code 產生邏輯
        function generateCode() {
            const inputField = document.getElementById('inputValue');
            const input = inputField.value.trim();
            const type = document.getElementById('codeType').value;

            if (!input) {
                alert('請先輸入數值！');
                return;
            }

            const grid = document.getElementById('codeGrid');
            const card = document.createElement('div');
            card.className = 'card';

            const canvas = document.createElement('canvas');
            let isValid = true;

            try {
                if (type === 'barcode') {
                    JsBarcode(canvas, input, { 
                        format: "CODE128", 
                        width: 2, 
                        height: 60, 
                        displayValue: false, 
                        margin: 0
                    });
                } else if (type === 'qrcode') {
                    QRCode.toCanvas(canvas, input, { width: 180, margin: 1 }, function(error) {
                        if (error) { console.error(error); isValid = false; }
                    });
                }
            } catch (e) {
                alert('產生失敗！\n※注意：傳統條碼 (Barcode) 通常不支援中文，若要輸入中文請使用 QR Code。');
                return;
            }

            if (!isValid) return;

            const textDisplay = document.createElement('div');
            textDisplay.className = 'text-display';
            textDisplay.textContent = input;

            const actions = document.createElement('div');
            actions.className = 'card-actions';

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'btn-download';
            downloadBtn.textContent = '下載圖片';
            downloadBtn.onclick = () => downloadImage(canvas, input, type);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn-remove';
            removeBtn.textContent = '移除';
            removeBtn.onclick = () => card.remove();

            actions.appendChild(downloadBtn);
            actions.appendChild(removeBtn);
            card.appendChild(canvas);
            card.appendChild(textDisplay);
            card.appendChild(actions);

            grid.prepend(card); 
        }

        function downloadImage(canvas, text, type) {
            const url = canvas.toDataURL("image/png");
            const a = document.createElement('a');
            a.href = url;
            const safeName = text.replace(/[^a-zA-Z0-9]/gi, '_').substring(0, 15);
            a.download = `${type}_${safeName || 'image'}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
