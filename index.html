<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業版 - 商品上架效率統計系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --warning-color: #c0392b;
            --bg-color: #f4f7f6;
            --table-border: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2 { text-align: center; margin-bottom: 25px; font-weight: 700; }

        .note-box {
            background-color: #ebf5fb;
            border-left: 5px solid var(--accent-color);
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 0.95em;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 20px;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 10px;
            text-align: center;
        }

        th:first-child { border-radius: 8px 0 0 0; }
        th:last-child { border-radius: 0 8px 0 0; }

        td {
            border-bottom: 1px solid var(--table-border);
            border-right: 1px solid var(--table-border);
            padding: 12px;
            text-align: center;
        }

        td:first-child { border-left: 1px solid var(--table-border); }

        input[type="time"], input[type="number"] {
            width: 85%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
        }

        .total-row { background-color: #fdfdfd; font-weight: bold; }
        .bg-red { background-color: #ffdada !important; color: var(--warning-color); }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 上架作業效率分析系統</h2>
    
    <div class="note-box">
        <strong>使用提示：</strong>
        <ul>
            <li>輸入「開始」與「結束」時間，系統將自動計算並扣除 120 秒 (2分鐘) 緩衝時間。</li>
            <li>平均值超過 15.6 秒將自動標記為紅色警示。</li>
        </ul>
    </div>

    <table>
        <thead>
            <tr>
                <th>分類</th>
                <th>開始時間</th>
                <th>結束時間</th>
                <th>顆數</th>
                <th>總秒數</th>
                <th>緩衝後秒</th>
                <th>平均/顆</th>
                <th>緩衝後平均</th>
            </tr>
        </thead>
        <tbody id="data-body">
            <script>
                for(let i=1; i<=5; i++){
                    document.write(`
                        <tr id="row-${i}">
                            <td><b>${i}上</b></td>
                            <td><input type="time" step="1" id="start-${i}" onchange="calculate()"></td>
                            <td><input type="time" step="1" id="end-${i}" onchange="calculate()"></td>
                            <td><input type="number" min="0" id="count-${i}" oninput="calculate()"></td>
                            <td id="total-sec-${i}">0</td>
                            <td id="buffer-sec-${i}">0</td>
                            <td id="avg-${i}">0.00</td>
                            <td id="avg-buf-${i}">0.00</td>
                        </tr>
                    `);
                }
            </script>
            <tr class="total-row">
                <td>總計</td>
                <td>-</td>
                <td>-</td>
                <td id="grand-count">0</td>
                <td id="grand-total-sec">0</td>
                <td id="grand-buffer-sec">0</td>
                <td id="grand-avg">0.00</td>
                <td>-</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function timeToSeconds(str) {
        const parts = str.split(':');
        return (parseInt(parts[0]) * 3600) + (parseInt(parts[1]) * 60) + (parseInt(parts[2]) || 0);
    }

    function calculate() {
        let grandCount = 0, grandTotal = 0, grandBuffer = 0;

        for(let i=1; i<=5; i++){
            const start = document.getElementById(`start-${i}`).value;
            const end = document.getElementById(`end-${i}`).value;
            const count = parseFloat(document.getElementById(`count-${i}`).value) || 0;
            
            let total = 0, buffer = 0, avg = 0, avgBuf = 0;

            if(start && end) {
                let s = timeToSeconds(start), e = timeToSeconds(end);
                if(e < s) e += 86400;
                total = e - s;
                buffer = Math.max(0, total - 120);
            }

            if(count > 0) {
                avg = total / count;
                avgBuf = buffer / count;
            }

            document.getElementById(`total-sec-${i}`).innerText = total;
            document.getElementById(`buffer-sec-${i}`).innerText = buffer;
            document.getElementById(`avg-${i}`).innerText = avg.toFixed(2);
            document.getElementById(`avg-buf-${i}`).innerText = avgBuf.toFixed(2);
            
            // 警示邏輯
            document.getElementById(`avg-${i}`).className = (count > 0 && avg > 15.6) ? 'bg-red' : '';
            document.getElementById(`avg-buf-${i}`).className = (count > 0 && avgBuf > 15.6) ? 'bg-red' : '';

            grandCount += count;
            grandTotal += total;
            grandBuffer += buffer;
        }

        document.getElementById('grand-count').innerText = grandCount;
        document.getElementById('grand-total-sec').innerText = grandTotal;
        document.getElementById('grand-buffer-sec').innerText = grandBuffer;
        
        let gAvg = grandCount > 0 ? (grandTotal / grandCount) : 0;
        const grandAvgEl = document.getElementById('grand-avg');
        grandAvgEl.innerText = gAvg.toFixed(2);
        grandAvgEl.className = (grandCount > 0 && gAvg > 15.6) ? 'bg-red' : '';
    }
</script>
</body>
</html>
