<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>條碼即時產生器</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        h2 {
            color: #2c3e50;
        }
        .input-group {
            margin-bottom: 30px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        .generate-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .generate-btn:hover {
            background-color: #2980b9;
        }
        /* 條碼顯示區塊排版 */
        #barcode-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .barcode-item {
            background: white;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .remove-btn {
            margin-top: 10px;
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .remove-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <h2>條碼即時產生器</h2>
    
    <div class="input-group">
        <input type="text" id="inputValue" placeholder="請輸入任意值..." onkeydown="if(event.key === 'Enter') generateBarcode()">
        <button class="generate-btn" onclick="generateBarcode()">產生條碼</button>
    </div>

    <div id="barcode-container"></div>

    <script>
        function generateBarcode() {
            const inputEl = document.getElementById('inputValue');
            const value = inputEl.value.trim();

            if (!value) {
                alert('請先輸入內容！');
                return;
            }

            // 1. 建立外層容器 (Card)
            const itemDiv = document.createElement('div');
            itemDiv.className = 'barcode-item';

            // 2. 建立 SVG 元素讓 JsBarcode 渲染
            const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

            // 3. 建立移除按鈕
            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-btn';
            removeBtn.textContent = '移除';
            removeBtn.onclick = function() {
                itemDiv.remove(); // 點擊時移除該條碼區塊
            };

            // 4. 將 SVG 和按鈕加入到外層容器中
            itemDiv.appendChild(svgEl);
            itemDiv.appendChild(removeBtn);

            // 5. 將整個區塊加入到網頁中
            document.getElementById('barcode-container').prepend(itemDiv); // 使用 prepend 讓最新的在最前面

            // 6. 使用 JsBarcode 產生條碼
            try {
                JsBarcode(svgEl, value, {
                    format: "CODE128", // CODE128 支援大小寫英文、數字與符號，最適合任意值
                    lineColor: "#000",
                    width: 2,
                    height: 60,
                    displayValue: true,
                    fontSize: 18
                });
            } catch (e) {
                alert('產生失敗：包含不支援的字元（建議使用英數字）');
                itemDiv.remove();
            }

            // 7. 清空輸入框，方便下次輸入
            inputEl.value = '';
            inputEl.focus();
        }
    </script>
</body>
</html>
