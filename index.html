<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業上架效率分析系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --bg-color: #f8f9fa;
            --border-color: #dee2e6;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2 { border-left: 5px solid var(--accent-color); padding-left: 15px; margin-bottom: 30px; }

        .note-box {
            background-color: #f1f7fd;
            border: 1px solid #d1e7f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            color: #2980b9;
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { background: var(--primary-color); color: white; padding: 15px; font-weight: 600; }
        th:first-child { border-radius: 8px 0 0 0; }
        th:last-child { border-radius: 0 8px 0 0; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: center; }

        input {
            width: 85%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
            transition: all 0.3s;
        }
        input:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(52,152,219,0.1); }

        .bg-red { background-color: #ffeaea !important; color: var(--danger-color); font-weight: bold; }
        .total-row { background-color: #f8f9fa; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 上架效率分析系統 v2.1</h2>
    
    <div class="note-box">
        <strong>💡 操作指南：</strong>
        <ul style="margin: 10px 0 0 20px; padding: 0;">
            <li>輸入開始與結束時間（HH:MM:SS）及包裹總數，系統自動即時計算。</li>
            <li>系統預設扣除 120 秒作業緩衝時間。</li>
            <li>當平均時間超過 <b>15.6 秒/顆</b>，系統將自動標記紅色警示。</li>
        </ul>
    </div>

    <table>
        <thead>
            <tr>
                <th>分類</th><th>開始時間</th><th>結束時間</th><th>包裹顆數</th><th>總秒數</th><th>緩衝後(秒)</th><th>無緩衝均速</th><th>緩衝後均速</th>
            </tr>
        </thead>
        <tbody id="data-body">
            <script>
                for(let i=1; i<=5; i++) {
                    document.write(`
                    <tr>
                        <td><b>${i}上</b></td>
                        <td><input type="time" step="1" id="start-${i}" onchange="calculateRow(${i})"></td>
                        <td><input type="time" step="1" id="end-${i}" onchange="calculateRow(${i})"></td>
                        <td><input type="number" id="count-${i}" oninput="calculateRow(${i})" placeholder="0"></td>
                        <td id="total-sec-${i}">0</td>
                        <td id="buffer-sec-${i}">0</td>
                        <td id="avg-${i}">0.00</td>
                        <td id="avg-buf-${i}">0.00</td>
                    </tr>`);
                }
            </script>
            <tr class="total-row">
                <td>總計</td><td>-</td><td>-</td>
                <td id="grand-count">0</td>
                <td id="grand-total-sec">0</td>
                <td id="grand-buffer-sec">0</td>
                <td id="grand-avg">0.00</td>
                <td>-</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function timeToSeconds(timeStr) {
        if (!timeStr) return null;
        const [h, m, s] = timeStr.split(':').map(Number);
        return h * 3600 + m * 60 + s;
    }

    function calculateRow(rowNum) {
        const start = timeToSeconds(document.getElementById(`start-${rowNum}`).value);
        const end = timeToSeconds(document.getElementById(`end-${rowNum}`).value);
        const count = parseFloat(document.getElementById(`count-${rowNum}`).value) || 0;

        if (start !== null && end !== null) {
            let total = (end < start) ? (end + 86400 - start) : (end - start);
            let buffer = Math.max(0, total - 120);
            
            document.getElementById(`total-sec-${rowNum}`).innerText = total;
            document.getElementById(`buffer-sec-${rowNum}`).innerText = buffer;

            if (count > 0) {
                let avg = total / count;
                let avgBuf = buffer / count;
                const avgEl = document.getElementById(`avg-${rowNum}`);
                const avgBufEl = document.getElementById(`avg-buf-${rowNum}`);
                
                avgEl.innerText = avg.toFixed(2);
                avgBufEl.innerText = avgBuf.toFixed(2);
                
                avg > 15.6 ? avgEl.classList.add('bg-red') : avgEl.classList.remove('bg-red');
                avgBuf > 15.6 ? avgBufEl.classList.add('bg-red') : avgBufEl.classList.remove('bg-red');
            }
        }
        calculateGrandTotal();
    }

    function calculateGrandTotal() {
        let gCount = 0, gTotal = 0, gBuf = 0;
        for(let i=1; i<=5; i++) {
            gCount += parseFloat(document.getElementById(`count-${i}`).value) || 0;
            gTotal += parseInt(document.getElementById(`total-sec-${i}`).innerText) || 0;
            gBuf += parseInt(document.getElementById(`buffer-sec-${i}`).innerText) || 0;
        }
        document.getElementById('grand-count').innerText = gCount;
        document.getElementById('grand-total-sec').innerText = gTotal;
        document.getElementById('grand-buffer-sec').innerText = gBuf;
        
        const gAvg = gCount > 0 ? (gTotal / gCount) : 0;
        const gAvgEl = document.getElementById('grand-avg');
        gAvgEl.innerText = gAvg.toFixed(2);
        gAvg > 15.6 ? gAvgEl.classList.add('bg-red') : gAvgEl.classList.remove('bg-red');
    }
</script>
</body>
</html>
