<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>門市人員實習計畫檢核表 - 線上簽署 (Google Drive 整合版)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; text-align: center; font-size: 24px; margin-bottom: 15px;}
        
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
        }
        .info-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }
        .info-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .toolbar {
            position: sticky;
            top: 0;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }
        
        select, button {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        select { border: 1px solid #ccc; background: white; flex-grow: 1;}
        button { background-color: #007bff; color: white; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        .btn-clear { background-color: #dc3545; }
        .btn-clear:hover { background-color: #c82333; }
        .btn-save { background-color: #28a745; }
        .btn-save:hover { background-color: #218838; }
        .btn-download { background-color: #17a2b8; }
        
        #drawMode { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; font-weight: bold; }

        .canvas-container {
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: white;
            width: 100%;
            max-width: 1000px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
            cursor: crosshair;
        }
        #status { font-weight: bold; color: #007bff; margin-bottom: 15px; text-align: center; width: 100%; }

        .record-section {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }

        /* 放大鏡手寫 Modal 樣式 (微調寬度讓排版更適合大範圍書寫) */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .modal-canvas-wrapper {
            position: relative;
            width: 100%;
            background: #f8f9fa;
            margin: 10px 0;
            border: 2px dashed #007bff;
            border-radius: 6px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .modal-canvas-wrapper canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            touch-action: none;
        }
        .modal-buttons {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; margin-top: 5px;
        }
        .btn-cancel { background-color: #6c757d; }
        .btn-cancel:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <h1>📝 實習檢核表 - 線上簽核</h1>

    <div class="card">
        <div class="info-grid">
            <div class="info-group"><label>📅 實習日期</label><input type="date" id="internshipDate"></div>
            <div class="info-group"><label>👤 名稱 (填寫人)</label><input type="text" id="staffName" placeholder="請輸入姓名"></div>
            <div class="info-group"><label>🌱 種子人員 1</label><input type="text" id="seedStaff1" placeholder="種子人員 1"></div>
            <div class="info-group"><label>🌱 種子人員 2</label><input type="text" id="seedStaff2" placeholder="種子人員 2"></div>
            <div class="info-group"><label>🏬 本身所在門市</label><input type="text" id="ownStore" placeholder="例：台北大安店"></div>
            <div class="info-group"><label>⏰ 班別</label><input type="text" id="shift" placeholder="例：早班/晚班"></div>
        </div>
        
        <div class="record-section">
            <select id="recordSelector">
                <option value="">-- 載入 Google Drive 紀錄中... --</option>
            </select>
            <button class="btn-download" onclick="downloadSelectedRecord()">📥 下載選擇紀錄</button>
        </div>
    </div>

    <div class="toolbar">
        <select id="drawMode">
            <option value="zoom">🔍 點擊超大局部放大寫字 (推薦)</option>
            <option value="draw">✍️ 直接畫筆手寫</option>
        </select>
        <select id="colorPicker" style="flex-grow: 0; width: 110px;">
            <option value="blue">🔵 藍筆</option>
            <option value="black">⚫ 黑筆</option>
            <option value="red">🔴 紅筆</option>
        </select>
        <button class="btn-clear" onclick="clearCanvas()">🧹 還原畫布</button>
        <button class="btn-save" onclick="saveAndUploadToGoogleDrive()">☁️ 儲存截圖至 Google Drive</button>
    </div>
    
    <div id="status">正在連線至 Google Drive 載入空白底圖...</div>

    <div class="canvas-container">
        <canvas id="canvas1"></canvas>
    </div>
    
    <div class="canvas-container">
        <canvas id="canvas2"></canvas>
    </div>

    <!-- 放大手寫區 Modal -->
    <div id="zoomModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#333; margin-bottom: 2px;">🔍 超大局部放大手寫區</h3>
            <p style="font-size:12px; color:#666; margin-bottom: 0;">已大幅放大區域，請輕鬆書寫，完成後點擊「確認寫入」。</p>
            
            <div class="modal-canvas-wrapper" id="modalCanvasWrapper">
                <canvas id="modalBgCanvas"></canvas>
                <canvas id="modalDrawCanvas"></canvas>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-clear" onclick="clearModalCanvas()">🧹 清除重寫</button>
                <button class="btn-cancel" onclick="closeZoomModal()">❌ 取消</button>
                <button class="btn-save" onclick="confirmZoomModal()">✅ 確認寫入</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyhefQv0rQdpogiTN-JhgHiyAvJFIVF-lrmPbQ3qypJF8JhdRwwLVbZ4YAW6bykNSTEBg/exec";

        const configs = [
            { id: 'canvas1', templateName: 'checklist_1.jpg', ctx: null, img: null, loaded: false },
            { id: 'canvas2', templateName: 'checklist_2.jpg', ctx: null, img: null, loaded: false }
        ];

        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let zoomContext = null;

        window.onload = () => {
            document.getElementById('internshipDate').valueAsDate = new Date();
            loadTemplatesFromDrive();
            loadRecordsFromDrive();
            initModalEvents();
        };

        async function loadTemplatesFromDrive() {
            const statusEl = document.getElementById('status');
            let loadedCount = 0;

            for (let i = 0; i < configs.length; i++) {
                const config = configs[i];
                const canvas = document.getElementById(config.id);
                const ctx = canvas.getContext('2d');
                config.ctx = ctx;

                try {
                    const res = await fetch(`${GAS_WEB_APP_URL}?action=getTemplate&name=${config.templateName}`);
                    const json = await res.json();
                    if (json.status !== "success") throw new Error(json.message);

                    const img = new Image();
                    img.onload = () => {
                        config.img = img;
                        config.loaded = true;

                        const MAX_WIDTH = 1200;
                        let targetWidth = img.width;
                        let targetHeight = img.height;

                        if (targetWidth > MAX_WIDTH) {
                            targetHeight = (MAX_WIDTH / targetWidth) * targetHeight;
                            targetWidth = MAX_WIDTH;
                        }

                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        loadedCount++;
                        if (loadedCount === configs.length) {
                            statusEl.innerText = "✅ 已成功讀取底圖，點選圖片區域即可超大放大手寫！";
                            statusEl.style.color = "#28a745";
                        }
                    };
                    img.src = json.base64;

                } catch (err) {
                    createFallbackCanvas(canvas, ctx, config.templateName);
                    statusEl.innerText = `❌ 無法載入 Google Drive 底圖，請確認檔案位置！`;
                    statusEl.style.color = "red";
                }

                canvas.addEventListener('mousedown', (e) => handlePointerDown(e, canvas));
                canvas.addEventListener('mousemove', (e) => draw(e, canvas, ctx));
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);

                canvas.addEventListener('touchstart', (e) => handlePointerDown(e, canvas), { passive: false });
                canvas.addEventListener('touchmove', (e) => draw(e, canvas, ctx), { passive: false });
                canvas.addEventListener('touchend', stopDrawing);
            }
        }

        function handlePointerDown(e, canvas) {
            const mode = document.getElementById('drawMode').value;
            if (mode === 'zoom') {
                if (e.cancelable) e.preventDefault();
                openZoomModal(e, canvas);
            } else {
                startDrawing(e, canvas);
            }
        }

        function getCoordinates(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function startDrawing(e, canvas) {
            if (e.cancelable) e.preventDefault();
            isDrawing = true;
            const pos = getCoordinates(e, canvas);
            lastX = pos.x; lastY = pos.y;
        }

        function draw(e, canvas, ctx) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();
            const pos = getCoordinates(e, canvas);
            const color = document.getElementById('colorPicker').value;
            const isModal = (canvas.id === 'modalDrawCanvas');

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = color;
            // 放大鏡模式下畫筆粗細適中，配合 3 倍放大非常清晰
            ctx.lineWidth = isModal ? 6 : 3; 
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = pos.x; lastY = pos.y;
        }

        function stopDrawing() { isDrawing = false; }

        function clearCanvas() {
            configs.forEach(config => {
                if(config.ctx) {
                    const canvas = document.getElementById(config.id);
                    config.ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if(config.img) config.ctx.drawImage(config.img, 0, 0, canvas.width, canvas.height);
                }
            });
            document.getElementById('status').innerText = "✅ 畫布已還原";
        }

        function initModalEvents() {
            const mCanvas = document.getElementById('modalDrawCanvas');
            const mCtx = mCanvas.getContext('2d');
            
            mCanvas.addEventListener('mousedown', (e) => startDrawing(e, mCanvas));
            mCanvas.addEventListener('mousemove', (e) => draw(e, mCanvas, mCtx));
            mCanvas.addEventListener('mouseup', stopDrawing);
            mCanvas.addEventListener('mouseout', stopDrawing);

            mCanvas.addEventListener('touchstart', (e) => startDrawing(e, mCanvas), { passive: false });
            mCanvas.addEventListener('touchmove', (e) => draw(e, mCanvas, mCtx), { passive: false });
            mCanvas.addEventListener('touchend', stopDrawing);
        }

        function openZoomModal(e, canvas) {
            const pos = getCoordinates(e, canvas);
            
            // **調整點 1：將擷取範圍縮小至 250 x 120 (原本是 500x250)，讓視野更局部、更放大！**
            let cw = Math.min(250, canvas.width);
            let ch = Math.min(120, canvas.height);

            let sx = pos.x - cw / 2;
            let sy = pos.y - ch / 2;

            if (sx < 0) sx = 0;
            if (sy < 0) sy = 0;
            if (sx + cw > canvas.width) sx = canvas.width - cw;
            if (sy + ch > canvas.height) sy = canvas.height - ch;

            zoomContext = { targetCanvas: canvas, sx, sy, cw, ch };

            const modalBg = document.getElementById('modalBgCanvas');
            const modalDraw = document.getElementById('modalDrawCanvas');
            const wrapper = document.getElementById('modalCanvasWrapper');

            // **調整點 2：放大倍率提升至 3 倍 (SCALE = 3)**
            const SCALE = 3;
            const mw = cw * SCALE;
            const mh = ch * SCALE;

            wrapper.style.aspectRatio = `${cw} / ${ch}`;
            modalBg.width = mw; modalBg.height = mh;
            modalDraw.width = mw; modalDraw.height = mh;

            const bgCtx = modalBg.getContext('2d');
            bgCtx.drawImage(canvas, sx, sy, cw, ch, 0, 0, mw, mh);

            clearModalCanvas();

            document.getElementById('zoomModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function clearModalCanvas() {
            const modalDraw = document.getElementById('modalDrawCanvas');
            const ctx = modalDraw.getContext('2d');
            ctx.clearRect(0, 0, modalDraw.width, modalDraw.height);
        }

        function closeZoomModal() {
            document.getElementById('zoomModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            zoomContext = null;
        }

        function confirmZoomModal() {
            if (!zoomContext) return;
            const mainCtx = zoomContext.targetCanvas.getContext('2d');
            const modalDraw = document.getElementById('modalDrawCanvas');

            mainCtx.drawImage(
                modalDraw, 
                0, 0, modalDraw.width, modalDraw.height, 
                zoomContext.sx, zoomContext.sy, zoomContext.cw, zoomContext.ch
            );

            closeZoomModal();
        }

        function createFallbackCanvas(canvas, ctx, filename) {
            canvas.width = 800; canvas.height = 600;
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff0000"; ctx.font = "bold 20px sans-serif";
            ctx.fillText(`⚠️ 讀取失敗: ${filename}`, 30, 50);
        }

        async function loadRecordsFromDrive() {
            const selector = document.getElementById('recordSelector');
            try {
                const res = await fetch(`${GAS_WEB_APP_URL}?action=listRecords`);
                const json = await res.json();
                if (json.status !== "success") throw new Error(json.message);
                selector.innerHTML = '<option value="">-- 請選擇 Google Drive 紀錄下載 --</option>';
                json.data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.name;
                    selector.appendChild(option);
                });
            } catch (err) {
                selector.innerHTML = '<option value="">-- 載入紀錄失敗 --</option>';
            }
        }

        async function downloadSelectedRecord() {
            const fileId = document.getElementById('recordSelector').value;
            if (!fileId) return alert("請先選擇歷史紀錄！");
            document.getElementById('status').innerText = "⏳ 正在下載圖檔...";
            try {
                const res = await fetch(`${GAS_WEB_APP_URL}?action=getFileBase64&id=${fileId}`);
                const json = await res.json();
                if (json.status !== "success") throw new Error("下載失敗");
                const link = document.createElement('a');
                link.href = json.base64; link.download = json.name;
                document.body.appendChild(link); link.click(); link.remove();
                document.getElementById('status').innerText = "✅ 下載成功！";
            } catch (err) { alert("下載失敗重試"); }
        }

        async function saveAndUploadToGoogleDrive() {
            const statusText = document.getElementById('status');
            const date = document.getElementById('internshipDate').value;
            const name = document.getElementById('staffName').value.trim();
            if (!name) return alert("請填寫姓名！");

            statusText.innerText = "⏳ 正在上傳至 Google Drive...";
            statusText.style.color = "#007bff";
            const clean = (s) => (s||'無').replace(/[\/\\?%*:|"<>]/g, '_');
            const baseFilename = `${date}+${clean(name)}+${clean(document.getElementById('seedStaff1').value)}+${clean(document.getElementById('seedStaff2').value)}+${clean(document.getElementById('ownStore').value)}+${clean(document.getElementById('shift').value)}`;

            try {
                for (let i = 0; i < configs.length; i++) {
                    const canvas = document.getElementById(configs[i].id);
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            fileName: `${baseFilename}_page${i+1}.jpg`,
                            base64Data: canvas.toDataURL('image/jpeg', 0.85),
                            contentType: 'image/jpeg'
                        })
                    });
                    const result = await response.json();
                    if (result.status !== 'success') throw new Error(result.message);
                }
                statusText.innerText = "✅ 儲存成功！圖片已存入 Google Drive。";
                statusText.style.color = "green";
                loadRecordsFromDrive();
                setTimeout(clearCanvas, 3000);
            } catch (error) {
                statusText.innerText = "❌ 儲存失敗：" + error.message;
                statusText.style.color = "red";
            }
        }
    </script>
</body>
</html>
