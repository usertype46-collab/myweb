<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>門市人員實習計畫檢核表 - 線上簽署</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; text-align: center; font-size: 24px; margin-bottom: 20px;}
        
        .toolbar {
            position: sticky;
            top: 0;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 600px;
        }
        
        select, button {
            padding: 10px 15px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        select { border: 1px solid #ccc; background: white; }
        button { background-color: #007bff; color: white; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        .btn-clear { background-color: #dc3545; }
        .btn-clear:hover { background-color: #c82333; }
        .btn-save { background-color: #28a745; width: 100%; }
        .btn-save:hover { background-color: #218838; }
        
        .canvas-container {
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: white;
            width: 100%;
            max-width: 1000px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
            cursor: crosshair;
        }
        #status { font-weight: bold; color: #007bff; margin-bottom: 15px; text-align: center; width: 100%; }
    </style>
</head>
<body>

    <h1>📝 實習檢核表 - 線上簽核</h1>

    <div class="toolbar">
        <select id="colorPicker">
            <option value="blue">藍筆 (Blue)</option>
            <option value="black">黑筆 (Black)</option>
            <option value="red">紅筆 (Red)</option>
        </select>
        <button class="btn-clear" onclick="clearCanvas()">🧹 還原為空白表單</button>
        <button onclick="downloadImage()">⬇️ 下載截圖至裝置</button>
        <button class="btn-save" onclick="saveToSupabase()">☁️ 儲存截圖並還原</button>
    </div>
    
    <div id="status">正在從 Supabase 載入原始圖檔，請稍候...</div>

    <div class="canvas-container">
        <canvas id="canvas1"></canvas>
    </div>
    
    <div class="canvas-container">
        <canvas id="canvas2"></canvas>
    </div>

    <script>
        // 初始化 Supabase
        const supabaseUrl = 'https://hyvcfxwoewvbpfzvfdnn.supabase.co';
        const supabaseKey = 'sb_publishable_TR5C2Zc7eOj9uUosUUsX4g_KbBOwey2';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Supabase templates 儲存桶公開網址前綴
        const templateBaseUrl = `${supabaseUrl}/storage/v1/object/public/templates/`;

        // 設定直接從 Supabase 讀取圖檔 (使用修正後的純英文檔名)
        const configs = [
            { 
                id: 'canvas1', 
                src: `${templateBaseUrl}checklist_1.jpg`, 
                ctx: null, img: null, loaded: false 
            },
            { 
                id: 'canvas2', 
                src: `${templateBaseUrl}checklist_2.jpg`, 
                ctx: null, img: null, loaded: false 
            }
        ];

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        // 從 Supabase 載入圖片
        function loadConfigImage(config, callback) {
            const img = new Image();
            // 必須設定 Anonymous，才能允許 Canvas 匯出圖片避免 CORS 錯誤
            img.crossOrigin = "Anonymous";

            img.onload = () => {
                config.img = img;
                config.loaded = true;
                callback(true);
            };

            img.onerror = () => {
                callback(false);
            };

            // 加上時間戳防止瀏覽器快取導致 CORS 失敗
            img.src = config.src + "?t=" + new Date().getTime();
        }

        // 初始化畫布與載入背景圖
        window.onload = () => {
            let loadedCount = 0;
            const statusEl = document.getElementById('status');

            configs.forEach(config => {
                const canvas = document.getElementById(config.id);
                const ctx = canvas.getContext('2d');
                config.ctx = ctx;

                loadConfigImage(config, (success) => {
                    if (success) {
                        console.log(`成功載入 Supabase 圖檔: ${config.src}`);
                        const img = config.img;
                        const MAX_WIDTH = 1200;
                        let targetWidth = img.width;
                        let targetHeight = img.height;

                        if (targetWidth > MAX_WIDTH) {
                            targetHeight = (MAX_WIDTH / targetWidth) * targetHeight;
                            targetWidth = MAX_WIDTH;
                        }

                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        // 畫上原始唯讀底圖
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        loadedCount++;
                        if (loadedCount === configs.length) {
                            statusEl.innerText = "✅ 圖檔載入完成，可以開始手寫！";
                            statusEl.style.color = "#28a745";
                        }
                    } else {
                        console.error(`圖片載入失敗:`, config.src);
                        canvas.width = 400;
                        canvas.height = 150;
                        ctx.fillStyle = "#f8d7da";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = "#721c24";
                        ctx.font = "bold 16px sans-serif";
                        ctx.fillText("❌ 找不到原始圖檔", 20, 40);
                        ctx.font = "12px sans-serif";
                        ctx.fillText("請確認已上傳 checklist_1.jpg 與 checklist_2.jpg 到 templates 桶", 20, 75);
                        statusEl.innerText = "⚠️ 圖片載入失敗，請檢查 Supabase Storage";
                        statusEl.style.color = "red";
                    }
                });

                // 註冊滑鼠與觸控事件
                canvas.addEventListener('mousedown', (e) => startDrawing(e, canvas));
                canvas.addEventListener('mousemove', (e) => draw(e, canvas, ctx));
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);

                canvas.addEventListener('touchstart', (e) => startDrawing(e, canvas), { passive: false });
                canvas.addEventListener('touchmove', (e) => draw(e, canvas, ctx), { passive: false });
                canvas.addEventListener('touchend', stopDrawing);
            });
        };

        function getCoordinates(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e, canvas) {
            if (e.cancelable) e.preventDefault();
            isDrawing = true;
            const pos = getCoordinates(e, canvas);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e, canvas, ctx) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();
            
            const pos = getCoordinates(e, canvas);
            const color = document.getElementById('colorPicker').value;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // 清除畫布上的手寫筆跡，重新載入原始底圖（還原功能）
        function clearCanvas(showMsg = true) {
            configs.forEach(config => {
                if(config.loaded && config.ctx && config.img) {
                    const canvas = document.getElementById(config.id);
                    config.ctx.clearRect(0, 0, canvas.width, canvas.height);
                    // 重新畫上原始 Supabase 的空白底圖
                    config.ctx.drawImage(config.img, 0, 0, canvas.width, canvas.height);
                }
            });
            if (showMsg) {
                document.getElementById('status').innerText = "✅ 畫面已還原為空白表單";
                setTimeout(() => document.getElementById('status').innerText = "✅ 圖檔載入完成，可以開始手寫！", 2000);
            }
        }

        // 下載包含手寫內容的截圖到裝置
        function downloadImage() {
            configs.forEach((config, index) => {
                if(!config.loaded) return;
                const canvas = document.getElementById(config.id);
                const dataURL = canvas.toDataURL('image/jpeg', 0.9);
                const link = document.createElement('a');
                link.download = `completed_form_page_${index + 1}.jpg`;
                link.href = dataURL;
                link.click();
            });
            document.getElementById('status').innerText = "✅ 已將截圖下載至您的裝置！";
            setTimeout(() => document.getElementById('status').innerText = "✅ 圖檔載入完成，可以開始手寫！", 3000);
        }

        function canvasToBlobAsync(canvas) {
            return new Promise((resolve) => {
                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.85);
            });
        }

        // 將截圖儲存至 Supabase，並在成功後清除畫布
        async function saveToSupabase() {
            const statusText = document.getElementById('status');
            statusText.innerText = "⏳ 正在儲存截圖至 Supabase，請稍候...";
            statusText.style.color = "#007bff";
            
            try {
                for (let i = 0; i < configs.length; i++) {
                    const config = configs[i];
                    if(!config.loaded) {
                        throw new Error(`第 ${i+1} 張圖片尚未準備完成`);
                    }

                    const canvas = document.getElementById(config.id);
                    const blob = await canvasToBlobAsync(canvas);
                    // 確保上傳到 completed_forms 的檔案名稱也是全英文
                    const filename = `signed_${Date.now()}_page${i+1}.jpg`;

                    // 上傳截圖到 completed_forms 桶
                    const { data: storageData, error: storageError } = await supabase.storage
                        .from('completed_forms')
                        .upload(filename, blob, {
                            cacheControl: '3600',
                            upsert: false
                        });

                    if (storageError) throw storageError;

                    // 取得已儲存檔案的公開網址
                    const { data: publicUrlData } = supabase.storage
                        .from('completed_forms')
                        .getPublicUrl(filename);
                    
                    const fileUrl = publicUrlData.publicUrl;

                    // 寫入資料庫紀錄 form_records 表格
                    const { error: dbError } = await supabase
                        .from('form_records')
                        .insert([
                            { file_name: filename, image_url: fileUrl }
                        ]);

                    if (dbError) throw dbError;
                }
                
                statusText.innerText = "✅ 儲存成功！已將手寫截圖上傳，畫面即將還原。";
                statusText.style.color = "green";
                
                // 儲存成功後，自動還原為原始圖檔，供下一位使用者填寫
                setTimeout(() => {
                    clearCanvas(false);
                    statusText.innerText = "✅ 畫面已還原，可以進行下一份手寫！";
                }, 2000);

            } catch (error) {
                console.error("Upload error:", error);
                statusText.innerText = "❌ 儲存失敗：" + error.message;
                statusText.style.color = "red";
            }
        }
    </script>
</body>
</html>
