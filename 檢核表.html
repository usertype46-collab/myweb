<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>門市人員實習計畫檢核表 - 線上簽署</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; text-align: center; }
        .toolbar {
            position: sticky;
            top: 0;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: 0.3s;
        }
        button:hover { background-color: #0056b3; }
        .btn-clear { background-color: #dc3545; }
        .btn-clear:hover { background-color: #c82333; }
        .btn-save { background-color: #28a745; }
        .btn-save:hover { background-color: #218838; }
        
        .canvas-container {
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: white;
            overflow: auto; /* 允許在大圖片上滾動 */
            max-width: 100%;
        }
        canvas {
            display: block;
            touch-action: none; /* 防止觸控畫畫時螢幕滾動 */
            cursor: crosshair;
        }
        #status { font-weight: bold; color: #28a745; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>📝 門市人員實習計畫檢核表 - 線上簽核</h1>

    <div class="toolbar">
        <select id="colorPicker" style="padding: 5px; font-size:16px;">
            <option value="blue">藍筆 (Blue)</option>
            <option value="black">黑筆 (Black)</option>
            <option value="red">紅筆 (Red)</option>
        </select>
        <button class="btn-clear" onclick="clearCanvas()">🧹 清除重寫</button>
        <button onclick="downloadImage()">⬇️ 下載圖片</button>
        <button class="btn-save" onclick="saveToSupabase()">☁️ 儲存並上傳至 Supabase</button>
    </div>
    
    <div id="status"></div>

    <div class="canvas-container">
        <canvas id="canvas1"></canvas>
    </div>
    
    <div class="canvas-container">
        <canvas id="canvas2"></canvas>
    </div>

    <script>
        // 初始化 Supabase (使用您提供的 URL 和 Key)
        const supabaseUrl = 'https://hyvcfxwoewvbpfzvfdnn.supabase.co';
        const supabaseKey = 'sb_publishable_TR5C2Zc7eOj9uUosUUsX4g_KbBOwey2';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 圖片與畫布設定
        const configs = [
            { id: 'canvas1', src: '1604.jpg', ctx: null, img: null },
            { id: 'canvas2', src: '1603.jpg', ctx: null, img: null }
        ];

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        // 初始化畫布與載入背景圖
        window.onload = () => {
            configs.forEach(config => {
                const canvas = document.getElementById(config.id);
                const ctx = canvas.getContext('2d');
                config.ctx = ctx;
                
                const img = new Image();
                img.src = config.src;
                img.onload = () => {
                    // 設定畫布大小符合圖片原始大小
                    canvas.width = img.width;
                    canvas.height = img.height;
                    // 如果原圖太大，可在此依比例縮小 (這裡保留原畫質)
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    config.img = img; // 保存圖片物件供清除時重繪
                };

                // 註冊滑鼠與觸控事件
                canvas.addEventListener('mousedown', (e) => startDrawing(e, canvas));
                canvas.addEventListener('mousemove', (e) => draw(e, canvas, ctx));
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);

                canvas.addEventListener('touchstart', (e) => startDrawing(e, canvas), { passive: false });
                canvas.addEventListener('touchmove', (e) => draw(e, canvas, ctx), { passive: false });
                canvas.addEventListener('touchend', stopDrawing);
            });
        };

        // 取得正確游標/觸控座標
        function getCoordinates(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            // 處理畫布因 CSS 縮放的問題
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e, canvas) {
            e.preventDefault();
            isDrawing = true;
            const pos = getCoordinates(e, canvas);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e, canvas, ctx) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const pos = getCoordinates(e, canvas);
            const color = document.getElementById('colorPicker').value;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // 清除畫布並重新鋪上背景
        function clearCanvas() {
            configs.forEach(config => {
                if(config.ctx && config.img) {
                    const canvas = document.getElementById(config.id);
                    config.ctx.clearRect(0, 0, canvas.width, canvas.height);
                    config.ctx.drawImage(config.img, 0, 0, canvas.width, canvas.height);
                }
            });
            document.getElementById('status').innerText = "畫布已清除";
        }

        // 下載圖片到本機
        function downloadImage() {
            configs.forEach((config, index) => {
                const canvas = document.getElementById(config.id);
                const dataURL = canvas.toDataURL('image/jpeg', 0.9);
                const link = document.createElement('a');
                link.download = `signed_page_${index + 1}.jpg`;
                link.href = dataURL;
                link.click();
            });
            document.getElementById('status').innerText = "已開始下載！";
        }

        // 將畫布轉 Blob
        function canvasToBlobAsync(canvas) {
            return new Promise((resolve) => {
                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.9);
            });
        }

        // 儲存並同步至 Supabase (Storage + Database)
        async function saveToSupabase() {
            const statusText = document.getElementById('status');
            statusText.innerText = "上傳中，請稍候...";
            
            try {
                for (let i = 0; i < configs.length; i++) {
                    const config = configs[i];
                    const canvas = document.getElementById(config.id);
                    const blob = await canvasToBlobAsync(canvas);
                    const filename = `signed_${Date.now()}_page${i+1}.jpg`;

                    // 1. 上傳至 Supabase Storage
                    const { data: storageData, error: storageError } = await supabase.storage
                        .from('completed_forms')
                        .upload(filename, blob, {
                            cacheControl: '3600',
                            upsert: false
                        });

                    if (storageError) throw storageError;

                    // 2. 獲取公共網址
                    const { data: publicUrlData } = supabase.storage
                        .from('completed_forms')
                        .getPublicUrl(filename);
                    
                    const fileUrl = publicUrlData.publicUrl;

                    // 3. 寫入 Database 表格紀錄同步
                    const { error: dbError } = await supabase
                        .from('form_records')
                        .insert([
                            { file_name: filename, image_url: fileUrl }
                        ]);

                    if (dbError) throw dbError;
                }
                
                statusText.innerText = "✅ 儲存成功！已同步至 Supabase。";
                statusText.style.color = "green";
            } catch (error) {
                console.error("Upload error:", error);
                statusText.innerText = "❌ 儲存失敗：" + error.message;
                statusText.style.color = "red";
            }
        }
    </script>
</body>
</html>
