<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>門市人員實習計畫檢核表 - 線上簽署</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; text-align: center; font-size: 24px; margin-bottom: 15px;}
        
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
        }
        .info-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }
        .info-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .toolbar {
            position: sticky;
            top: 0;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }
        
        select, button {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        select { border: 1px solid #ccc; background: white; flex-grow: 1;}
        button { background-color: #007bff; color: white; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        .btn-clear { background-color: #dc3545; }
        .btn-clear:hover { background-color: #c82333; }
        .btn-save { background-color: #28a745; }
        .btn-save:hover { background-color: #218838; }
        .btn-download { background-color: #17a2b8; }
        
        .canvas-container {
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: white;
            width: 100%;
            max-width: 1000px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
            cursor: crosshair;
        }
        #status { font-weight: bold; color: #007bff; margin-bottom: 15px; text-align: center; width: 100%; }

        .record-section {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }
    </style>
</head>
<body>

    <h1>📝 實習檢核表 - 線上簽核</h1>

    <!-- 填寫資料區 -->
    <div class="card">
        <div class="info-grid">
            <div class="info-group"><label>📅 實習日期</label><input type="date" id="internshipDate"></div>
            <div class="info-group"><label>👤 名稱 (填寫人)</label><input type="text" id="staffName" placeholder="請輸入姓名"></div>
            <div class="info-group"><label>🌱 種子人員 1</label><input type="text" id="seedStaff1" placeholder="種子人員 1"></div>
            <div class="info-group"><label>🌱 種子人員 2</label><input type="text" id="seedStaff2" placeholder="種子人員 2"></div>
            <div class="info-group"><label>🏬 本身所在門市</label><input type="text" id="ownStore" placeholder="例：台北大安店"></div>
            <div class="info-group"><label>⏰ 班別</label><input type="text" id="shift" placeholder="例：早班/晚班"></div>
        </div>
        
        <!-- 讀取與下載歷史紀錄區 -->
        <div class="record-section">
            <select id="recordSelector">
                <option value="">-- 載入雲端紀錄中... --</option>
            </select>
            <button class="btn-download" onclick="downloadSelectedRecord()">📥 下載選擇紀錄</button>
        </div>
    </div>

    <!-- 工具列 -->
    <div class="toolbar">
        <select id="colorPicker" style="flex-grow: 0;">
            <option value="blue">藍筆 (Blue)</option>
            <option value="black">黑筆 (Black)</option>
            <option value="red">紅筆 (Red)</option>
        </select>
        <button class="btn-clear" onclick="clearCanvas()">🧹 還原畫布</button>
        <button class="btn-save" onclick="saveAndUploadToSupabase()">☁️ 儲存紀錄並上傳</button>
    </div>
    
    <div id="status">正在從 Supabase 載入圖檔... (若持續空白，請檢查 Supabase 儲存桶 CORS 設定)</div>

    <div class="canvas-container">
        <canvas id="canvas1"></canvas>
    </div>
    
    <div class="canvas-container">
        <canvas id="canvas2"></canvas>
    </div>

    <script>
        // 初始化 Supabase (請確認 Key 正確)
        const supabaseUrl = 'https://hyvcfxwoewvbpfzvfdnn.supabase.co';
        const supabaseKey = 'sb_publishable_TR5C2Zc7eOj9uUosUUsX4g_KbBOwey2';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const { data: url1 } = supabase.storage.from('templates').getPublicUrl('checklist_1.jpg');
        const { data: url2 } = supabase.storage.from('templates').getPublicUrl('checklist_2.jpg');

        const configs = [
            { id: 'canvas1', src: url1.publicUrl, ctx: null, img: null, loaded: false },
            { id: 'canvas2', src: url2.publicUrl, ctx: null, img: null, loaded: false }
        ];

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        window.onload = () => {
            document.getElementById('internshipDate').valueAsDate = new Date();
            loadImagesViaFetch();
            loadRecordsFromDatabase(); // 載入歷史紀錄到下拉選單
        };

        // 讀取圖檔並解決白畫面的進階寫法
        async function loadImagesViaFetch() {
            const statusEl = document.getElementById('status');
            let loadedCount = 0;

            for (let i = 0; i < configs.length; i++) {
                const config = configs[i];
                const canvas = document.getElementById(config.id);
                const ctx = canvas.getContext('2d');
                config.ctx = ctx;

                try {
                    // 使用 fetch 並強制 mode: 'cors'
                    const response = await fetch(config.src + "?t=" + Date.now(), { mode: 'cors' });
                    if (!response.ok) throw new Error("網路請求失敗");
                    const blob = await response.blob();
                    const objectURL = URL.createObjectURL(blob);
                    
                    const img = new Image();
                    img.onload = () => {
                        config.img = img;
                        config.loaded = true;

                        const MAX_WIDTH = 1200;
                        let targetWidth = img.width;
                        let targetHeight = img.height;

                        if (targetWidth > MAX_WIDTH) {
                            targetHeight = (MAX_WIDTH / targetWidth) * targetHeight;
                            targetWidth = MAX_WIDTH;
                        }

                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        URL.revokeObjectURL(objectURL); // 釋放記憶體

                        loadedCount++;
                        if (loadedCount === configs.length) {
                            statusEl.innerText = "✅ 圖檔載入完成，可以開始手寫！";
                            statusEl.style.color = "#28a745";
                        }
                    };
                    img.src = objectURL;

                } catch (err) {
                    console.error("載入失敗:", err);
                    createFallbackCanvas(canvas, ctx, config.id);
                    statusEl.innerText = "⚠️ 遠端圖檔載入失敗，請確認 Supabase CORS 設置已開啟！";
                    statusEl.style.color = "red";
                }

                // 註冊繪圖互動事件
                canvas.addEventListener('mousedown', (e) => startDrawing(e, canvas));
                canvas.addEventListener('mousemove', (e) => draw(e, canvas, ctx));
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);

                canvas.addEventListener('touchstart', (e) => startDrawing(e, canvas), { passive: false });
                canvas.addEventListener('touchmove', (e) => draw(e, canvas, ctx), { passive: false });
                canvas.addEventListener('touchend', stopDrawing);
            }
        }

        function createFallbackCanvas(canvas, ctx, id) {
            canvas.width = 800;
            canvas.height = 600;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff0000";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText(`⚠️ 圖檔載入失敗 (${id})`, 30, 50);
            ctx.font = "16px sans-serif";
            ctx.fillStyle = "#333";
            ctx.fillText("原因：您的 Supabase Storage 未開啟 CORS 跨域權限。", 30, 90);
            ctx.fillText("請至 Supabase 後台 -> Storage -> Configuration -> CORS settings 添加規則。", 30, 120);
        }

        function getCoordinates(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function startDrawing(e, canvas) {
            if (e.cancelable) e.preventDefault();
            isDrawing = true;
            const pos = getCoordinates(e, canvas);
            lastX = pos.x; lastY = pos.y;
        }

        function draw(e, canvas, ctx) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();
            const pos = getCoordinates(e, canvas);
            const color = document.getElementById('colorPicker').value;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = pos.x; lastY = pos.y;
        }

        function stopDrawing() { isDrawing = false; }

        function clearCanvas() {
            configs.forEach(config => {
                if(config.ctx) {
                    const canvas = document.getElementById(config.id);
                    config.ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if(config.img) config.ctx.drawImage(config.img, 0, 0, canvas.width, canvas.height);
                }
            });
            document.getElementById('status').innerText = "✅ 畫布已還原";
        }

        function canvasToBlobAsync(canvas) {
            return new Promise((resolve) => { canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.85); });
        }

        // ================= 新增功能：載入與下載資料庫紀錄 ================= //
        
        async function loadRecordsFromDatabase() {
            const selector = document.getElementById('recordSelector');
            try {
                const { data, error } = await supabase
                    .from('form_records')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                selector.innerHTML = '<option value="">-- 請選擇歷史紀錄下載 --</option>';
                data.forEach(record => {
                    const option = document.createElement('option');
                    option.value = record.image_url;
                    option.textContent = record.file_name;
                    selector.appendChild(option);
                });
            } catch (err) {
                selector.innerHTML = '<option value="">-- 紀錄載入失敗 --</option>';
                console.error("載入紀錄失敗:", err);
            }
        }

        async function downloadSelectedRecord() {
            const selector = document.getElementById('recordSelector');
            const url = selector.value;
            const filename = selector.options[selector.selectedIndex].textContent;

            if (!url) {
                alert("請先從下拉選單選擇一筆紀錄！");
                return;
            }

            try {
                // 透過 fetch 轉換為 Blob 以強制瀏覽器下載而非新開分頁
                document.getElementById('status').innerText = "⏳ 正在下載圖檔...";
                const response = await fetch(url);
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                
                window.URL.revokeObjectURL(downloadUrl);
                document.getElementById('status').innerText = "✅ 下載完成！";
            } catch (error) {
                console.error("下載失敗:", error);
                alert("下載失敗，可能是瀏覽器安全性限制，將另開視窗顯示圖檔。");
                window.open(url, '_blank');
            }
        }

        // ================= 更新：儲存與自訂檔名邏輯 ================= //

        async function saveAndUploadToSupabase() {
            const statusText = document.getElementById('status');
            
            // 取得所有填寫的資訊
            const date = document.getElementById('internshipDate').value;
            const name = document.getElementById('staffName').value.trim() || '無名稱';
            const seed1 = document.getElementById('seedStaff1').value.trim() || '無';
            const seed2 = document.getElementById('seedStaff2').value.trim() || '無';
            const store = document.getElementById('ownStore').value.trim() || '無門市';
            const shift = document.getElementById('shift').value.trim() || '無班別';

            if (name === '無名稱') {
                alert("請填寫「名稱 (填寫人)」後再進行儲存！");
                document.getElementById('staffName').focus();
                return;
            }

            statusText.innerText = "⏳ 正在處理並上傳至 Supabase，請稍候...";
            statusText.style.color = "#007bff";
            
            try {
                // 檔名格式要求：實習日期+名稱+種子人員1+種子人員2+本身所在門市+班別
                // 避免非法字元，進行字串清理
                const cleanStr = (str) => str.replace(/[\/\\?%*:|"<>]/g, '_');
                const baseFilename = `${date}+${cleanStr(name)}+${cleanStr(seed1)}+${cleanStr(seed2)}+${cleanStr(store)}+${cleanStr(shift)}`;

                for (let i = 0; i < configs.length; i++) {
                    const config = configs[i];
                    const canvas = document.getElementById(config.id);
                    const blob = await canvasToBlobAsync(canvas);
                    
                    const filename = `${baseFilename}_page${i+1}.jpg`;

                    // 1. 上傳至 Supabase Storage
                    const { error: storageError } = await supabase.storage
                        .from('completed_forms')
                        .upload(filename, blob, { cacheControl: '3600', upsert: true });

                    if (storageError) throw storageError;

                    // 2. 取得公開網址
                    const { data: publicUrlData } = supabase.storage
                        .from('completed_forms')
                        .getPublicUrl(filename);
                    
                    const fileUrl = publicUrlData.publicUrl;

                    // 3. 寫入資料庫 form_records
                    const { error: dbError } = await supabase
                        .from('form_records')
                        .insert([{ 
                            file_name: filename, 
                            image_url: fileUrl,
                            internship_date: date,
                            staff_name: name,
                            seed_staff_1: seed1,
                            seed_staff_2: seed2,
                            own_store: store,
                            shift: shift
                        }]);

                    if (dbError) throw dbError;
                }
                
                statusText.innerText = "✅ 儲存成功！資料已完整寫入 Supabase。";
                statusText.style.color = "green";
                
                // 刷新下拉選單紀錄
                loadRecordsFromDatabase();

                setTimeout(() => {
                    clearCanvas();
                    statusText.innerText = "✅ 畫面已還原，可以進行下一位填寫！";
                }, 3000);

            } catch (error) {
                console.error("Upload error:", error);
                statusText.innerText = "❌ 儲存失敗：" + error.message;
                statusText.style.color = "red";
            }
        }
    </script>
</body>
</html>
