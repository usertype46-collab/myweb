<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>門市人員實習計畫檢核表 - 線上簽署 (Google Drive 整合版)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; text-align: center; font-size: 24px; margin-bottom: 15px;}
        
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
        }
        .info-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }
        .info-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .toolbar {
            position: sticky;
            top: 0;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }
        
        select, button {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        select { border: 1px solid #ccc; background: white; flex-grow: 1;}
        button { background-color: #007bff; color: white; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        .btn-clear { background-color: #dc3545; }
        .btn-clear:hover { background-color: #c82333; }
        .btn-save { background-color: #28a745; }
        .btn-save:hover { background-color: #218838; }
        .btn-download { background-color: #17a2b8; }
        
        .canvas-container {
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: white;
            width: 100%;
            max-width: 1000px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
            cursor: crosshair;
        }
        #status { font-weight: bold; color: #007bff; margin-bottom: 15px; text-align: center; width: 100%; }

        .record-section {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }
    </style>
</head>
<body>

    <h1>📝 實習檢核表 - 線上簽核 (Google Drive)</h1>

    <!-- 資料填寫區 -->
    <div class="card">
        <div class="info-grid">
            <div class="info-group"><label>📅 實習日期</label><input type="date" id="internshipDate"></div>
            <div class="info-group"><label>👤 名稱 (填寫人)</label><input type="text" id="staffName" placeholder="請輸入姓名"></div>
            <div class="info-group"><label>🌱 種子人員 1</label><input type="text" id="seedStaff1" placeholder="種子人員 1"></div>
            <div class="info-group"><label>🌱 種子人員 2</label><input type="text" id="seedStaff2" placeholder="種子人員 2"></div>
            <div class="info-group"><label>🏬 本身所在門市</label><input type="text" id="ownStore" placeholder="例：台北大安店"></div>
            <div class="info-group"><label>⏰ 班別</label><input type="text" id="shift" placeholder="例：早班/晚班"></div>
        </div>
        
        <!-- Google Drive 歷史紀錄下拉與下載區 -->
        <div class="record-section">
            <select id="recordSelector">
                <option value="">-- 載入 Google Drive 紀錄中... --</option>
            </select>
            <button class="btn-download" onclick="downloadSelectedRecord()">📥 下載選擇紀錄</button>
        </div>
    </div>

    <!-- 工具列 -->
    <div class="toolbar">
        <select id="colorPicker" style="flex-grow: 0;">
            <option value="blue">藍筆 (Blue)</option>
            <option value="black">黑筆 (Black)</option>
            <option value="red">紅筆 (Red)</option>
        </select>
        <button class="btn-clear" onclick="clearCanvas()">🧹 還原畫布</button>
        <button class="btn-save" onclick="saveAndUploadToGoogleDrive()">☁️ 儲存截圖至 Google Drive</button>
    </div>
    
    <div id="status">正在連線至 Google Drive 載入空白底圖...</div>

    <div class="canvas-container">
        <canvas id="canvas1"></canvas>
    </div>
    
    <div class="canvas-container">
        <canvas id="canvas2"></canvas>
    </div>

    <script>
        // ⚠️ 請將下方替換為您在步驟一部署產生的 Google Apps Script URL
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyhefQv0rQdpogiTN-JhgHiyAvJFIVF-lrmPbQ3qypJF8JhdRwwLVbZ4YAW6bykNSTEBg/exec";

        const configs = [
            { id: 'canvas1', templateName: 'checklist_1.jpg', ctx: null, img: null, loaded: false },
            { id: 'canvas2', templateName: 'checklist_2.jpg', ctx: null, img: null, loaded: false }
        ];

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        window.onload = () => {
            document.getElementById('internshipDate').valueAsDate = new Date();
            loadTemplatesFromDrive();
            loadRecordsFromDrive();
        };

        // 1. 從 Google Drive 載入底圖 (使用 Base64 避開跨域/白畫面問題)
        async function loadTemplatesFromDrive() {
            const statusEl = document.getElementById('status');
            let loadedCount = 0;

            for (let i = 0; i < configs.length; i++) {
                const config = configs[i];
                const canvas = document.getElementById(config.id);
                const ctx = canvas.getContext('2d');
                config.ctx = ctx;

                try {
                    const res = await fetch(`${GAS_WEB_APP_URL}?action=getTemplate&name=${config.templateName}`);
                    const json = await res.json();

                    if (json.status !== "success") throw new Error(json.message);

                    const img = new Image();
                    img.onload = () => {
                        config.img = img;
                        config.loaded = true;

                        const MAX_WIDTH = 1200;
                        let targetWidth = img.width;
                        let targetHeight = img.height;

                        if (targetWidth > MAX_WIDTH) {
                            targetHeight = (MAX_WIDTH / targetWidth) * targetHeight;
                            targetWidth = MAX_WIDTH;
                        }

                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        loadedCount++;
                        if (loadedCount === configs.length) {
                            statusEl.innerText = "✅ 已成功讀取 Google Drive 底圖，可以開始簽核手寫！";
                            statusEl.style.color = "#28a745";
                        }
                    };
                    img.src = json.base64;

                } catch (err) {
                    console.error("載入失敗:", err);
                    createFallbackCanvas(canvas, ctx, config.templateName);
                    statusEl.innerText = `❌ 無法載入 Google Drive 底圖 (${config.templateName})，請確認檔案已放至資料夾！`;
                    statusEl.style.color = "red";
                }

                // 註冊畫筆事件
                canvas.addEventListener('mousedown', (e) => startDrawing(e, canvas));
                canvas.addEventListener('mousemove', (e) => draw(e, canvas, ctx));
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);

                canvas.addEventListener('touchstart', (e) => startDrawing(e, canvas), { passive: false });
                canvas.addEventListener('touchmove', (e) => draw(e, canvas, ctx), { passive: false });
                canvas.addEventListener('touchend', stopDrawing);
            }
        }

        function createFallbackCanvas(canvas, ctx, filename) {
            canvas.width = 800;
            canvas.height = 600;
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff0000"; ctx.font = "bold 20px sans-serif";
            ctx.fillText(`⚠️ 讀取失敗: ${filename}`, 30, 50);
            ctx.font = "15px sans-serif"; ctx.fillStyle = "#333";
            ctx.fillText("請確認已將 checklist_1.jpg 和 checklist_2.jpg 上傳至 Google Drive 資料夾中。", 30, 90);
        }

        function getCoordinates(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function startDrawing(e, canvas) {
            if (e.cancelable) e.preventDefault();
            isDrawing = true;
            const pos = getCoordinates(e, canvas);
            lastX = pos.x; lastY = pos.y;
        }

        function draw(e, canvas, ctx) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();
            const pos = getCoordinates(e, canvas);
            const color = document.getElementById('colorPicker').value;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = pos.x; lastY = pos.y;
        }

        function stopDrawing() { isDrawing = false; }

        function clearCanvas() {
            configs.forEach(config => {
                if(config.ctx) {
                    const canvas = document.getElementById(config.id);
                    config.ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if(config.img) config.ctx.drawImage(config.img, 0, 0, canvas.width, canvas.height);
                }
            });
            document.getElementById('status').innerText = "✅ 畫布已還原";
        }

        // 2. 讀取 Google Drive 儲存紀錄下拉清單
        async function loadRecordsFromDrive() {
            const selector = document.getElementById('recordSelector');
            try {
                const res = await fetch(`${GAS_WEB_APP_URL}?action=listRecords`);
                const json = await res.json();

                if (json.status !== "success") throw new Error(json.message);

                selector.innerHTML = '<option value="">-- 請選擇 Google Drive 紀錄下載 --</option>';
                json.data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.name;
                    selector.appendChild(option);
                });
            } catch (err) {
                selector.innerHTML = '<option value="">-- 載入 Google Drive 紀錄失敗 --</option>';
                console.error("載入失敗:", err);
            }
        }

        // 3. 下載所選 Google Drive 檔案
        async function downloadSelectedRecord() {
            const selector = document.getElementById('recordSelector');
            const fileId = selector.value;

            if (!fileId) {
                alert("請先選擇一份歷史紀錄！");
                return;
            }

            const statusText = document.getElementById('status');
            statusText.innerText = "⏳ 正在從 Google Drive 下載圖檔...";

            try {
                const res = await fetch(`${GAS_WEB_APP_URL}?action=getFileBase64&id=${fileId}`);
                const json = await res.json();

                if (json.status !== "success") throw new Error("下載失敗");

                const link = document.createElement('a');
                link.href = json.base64;
                link.download = json.name;
                document.body.appendChild(link);
                link.click();
                link.remove();

                statusText.innerText = "✅ 圖檔已成功下載！";
            } catch (err) {
                console.error("下載失敗:", err);
                alert("下載失敗，請稍後重試。");
            }
        }

        // 4. 儲存截圖至 Google Drive
        async function saveAndUploadToGoogleDrive() {
            const statusText = document.getElementById('status');
            
            const date = document.getElementById('internshipDate').value;
            const name = document.getElementById('staffName').value.trim() || '無名稱';
            const seed1 = document.getElementById('seedStaff1').value.trim() || '無';
            const seed2 = document.getElementById('seedStaff2').value.trim() || '無';
            const store = document.getElementById('ownStore').value.trim() || '無門市';
            const shift = document.getElementById('shift').value.trim() || '無班別';

            if (name === '無名稱') {
                alert("請填寫「名稱 (填寫人)」後再儲存！");
                document.getElementById('staffName').focus();
                return;
            }

            statusText.innerText = "⏳ 正在上傳至 Google Drive 共用資料夾，請稍候...";
            statusText.style.color = "#007bff";

            // 檔名格式：實習日期+名稱+種子人員1+種子人員2+本身所在門市+班別
            const cleanStr = (s) => s.replace(/[\/\\?%*:|"<>]/g, '_');
            const baseFilename = `${date}+${cleanStr(name)}+${cleanStr(seed1)}+${cleanStr(seed2)}+${cleanStr(store)}+${cleanStr(shift)}`;

            try {
                for (let i = 0; i < configs.length; i++) {
                    const canvas = document.getElementById(configs[i].id);
                    const base64Data = canvas.toDataURL('image/jpeg', 0.85);
                    const filename = `${baseFilename}_page${i+1}.jpg`;

                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            fileName: filename,
                            base64Data: base64Data,
                            contentType: 'image/jpeg'
                        })
                    });

                    const result = await response.json();
                    if (result.status !== 'success') throw new Error(result.message);
                }

                statusText.innerText = "✅ 儲存成功！簽核圖片已存入 Google Drive 共用資料夾。";
                statusText.style.color = "green";

                // 重新刷新下拉歷史清單
                loadRecordsFromDrive();

                setTimeout(() => {
                    clearCanvas();
                    statusText.innerText = "✅ 畫布已還原，可進行下一位簽核！";
                }, 3000);

            } catch (error) {
                console.error("Upload error:", error);
                statusText.innerText = "❌ 儲存至 Google Drive 失敗：" + error.message;
                statusText.style.color = "red";
            }
        }
    </script>
</body>
</html>
