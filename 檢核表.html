<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>門市人員實習計畫檢核表 - 線上簽署</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; text-align: center; font-size: 24px; margin-bottom: 20px;}
        
        .toolbar {
            position: sticky;
            top: 0;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 600px;
        }
        
        select, button {
            padding: 10px 15px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        select { border: 1px solid #ccc; background: white; }
        button { background-color: #007bff; color: white; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        .btn-clear { background-color: #dc3545; }
        .btn-clear:hover { background-color: #c82333; }
        .btn-save { background-color: #28a745; width: 100%; }
        .btn-save:hover { background-color: #218838; }
        
        .canvas-container {
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: white;
            width: 100%;
            max-width: 1000px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
            cursor: crosshair;
        }
        #status { font-weight: bold; color: #007bff; margin-bottom: 15px; text-align: center; width: 100%; }
    </style>
</head>
<body>

    <h1>📝 實習檢核表 - 線上簽核</h1>

    <div class="toolbar">
        <select id="colorPicker">
            <option value="blue">藍筆 (Blue)</option>
            <option value="black">黑筆 (Black)</option>
            <option value="red">紅筆 (Red)</option>
        </select>
        <button class="btn-clear" onclick="clearCanvas()">🧹 還原畫布</button>
        <button onclick="downloadImage()">⬇️ 下載截圖</button>
        <button class="btn-save" onclick="saveToSupabase()">☁️ 儲存截圖並上傳</button>
    </div>
    
    <div id="status">正在連線至 Supabase 取得圖檔...</div>

    <div class="canvas-container">
        <canvas id="canvas1"></canvas>
    </div>
    
    <div class="canvas-container">
        <canvas id="canvas2"></canvas>
    </div>

    <script>
        // 初始化 Supabase
        const supabaseUrl = 'https://hyvcfxwoewvbpfzvfdnn.supabase.co';
        const supabaseKey = 'sb_publishable_TR5C2Zc7eOj9uUosUUsX4g_KbBOwey2';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 透過 Supabase SDK 直接取得公開網址，避免手動串接字串出錯
        const { data: url1 } = supabase.storage.from('templates').getPublicUrl('checklist_1.jpg');
        const { data: url2 } = supabase.storage.from('templates').getPublicUrl('checklist_2.jpg');

        const configs = [
            { id: 'canvas1', src: url1.publicUrl, ctx: null, img: null, loaded: false },
            { id: 'canvas2', src: url2.publicUrl, ctx: null, img: null, loaded: false }
        ];

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        function initCanvas(config) {
            const canvas = document.getElementById(config.id);
            const ctx = canvas.getContext('2d');
            config.ctx = ctx;

            const img = new Image();
            img.crossOrigin = "anonymous";

            // 設定 6 秒超時保護，避免網路卡住時無限等待空白
            const timer = setTimeout(() => {
                if (!config.loaded) {
                    console.warn(`圖片載入超時，啟動備用畫布: ${config.id}`);
                    createFallbackCanvas(canvas, ctx, config.id);
                    config.loaded = true;
                    checkAllLoaded();
                }
            }, 6000);

            img.onload = () => {
                clearTimeout(timer);
                config.img = img;
                config.loaded = true;

                const MAX_WIDTH = 1200;
                let targetWidth = img.width;
                let targetHeight = img.height;

                if (targetWidth > MAX_WIDTH) {
                    targetHeight = (MAX_WIDTH / targetWidth) * targetHeight;
                    targetWidth = MAX_WIDTH;
                }

                canvas.width = targetWidth;
                canvas.height = targetHeight;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                checkAllLoaded();
            };

            img.onerror = (err) => {
                clearTimeout(timer);
                console.error(`圖片載入發生錯誤 (${config.id}):`, err);
                createFallbackCanvas(canvas, ctx, config.id);
                config.loaded = true;
                checkAllLoaded();
            };

            // 加上時間戳防止快取
            img.src = config.src + (config.src.includes('?') ? '&' : '?') + 't=' + Date.now();

            // 註冊事件
            canvas.addEventListener('mousedown', (e) => startDrawing(e, canvas));
            canvas.addEventListener('mousemove', (e) => draw(e, canvas, ctx));
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            canvas.addEventListener('touchstart', (e) => startDrawing(e, canvas), { passive: false });
            canvas.addEventListener('touchmove', (e) => draw(e, canvas, ctx), { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function createFallbackCanvas(canvas, ctx, id) {
            canvas.width = 800;
            canvas.height = 600;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#333333";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText(`⚠️ 遠端圖檔載入失敗 (${id})`, 30, 50);
            ctx.font = "14px sans-serif";
            ctx.fillText("請檢查 Supabase Storage 是否確實存在 'checklist_1.jpg' 與 'checklist_2.jpg'", 30, 90);
            ctx.fillText("您仍可在此空白區域進行手寫測試或截圖。", 30, 120);
        }

        let totalLoaded = 0;
        function checkAllLoaded() {
            totalLoaded++;
            if (totalLoaded >= configs.length) {
                const statusEl = document.getElementById('status');
                statusEl.innerText = "✅ 系統就緒，可以開始手寫！";
                statusEl.style.color = "#28a745";
            }
        }

        window.onload = () => {
            configs.forEach(config => initCanvas(config));
        };

        function getCoordinates(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e, canvas) {
            if (e.cancelable) e.preventDefault();
            isDrawing = true;
            const pos = getCoordinates(e, canvas);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e, canvas, ctx) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();
            
            const pos = getCoordinates(e, canvas);
            const color = document.getElementById('colorPicker').value;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearCanvas() {
            configs.forEach(config => {
                if(config.ctx) {
                    const canvas = document.getElementById(config.id);
                    config.ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if(config.img) {
                        config.ctx.drawImage(config.img, 0, 0, canvas.width, canvas.height);
                    } else {
                        createFallbackCanvas(canvas, config.ctx, config.id);
                    }
                }
            });
            document.getElementById('status').innerText = "✅ 畫布已還原";
            setTimeout(() => document.getElementById('status').innerText = "✅ 系統就緒，可以開始手寫！", 2000);
        }

        function downloadImage() {
            configs.forEach((config, index) => {
                const canvas = document.getElementById(config.id);
                const dataURL = canvas.toDataURL('image/jpeg', 0.9);
                const link = document.createElement('a');
                link.download = `completed_form_page_${index + 1}.jpg`;
                link.href = dataURL;
                link.click();
            });
            document.getElementById('status').innerText = "✅ 已下載截圖！";
        }

        function canvasToBlobAsync(canvas) {
            return new Promise((resolve) => {
                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.85);
            });
        }

        async function saveToSupabase() {
            const statusText = document.getElementById('status');
            statusText.innerText = "⏳ 正在上傳至 Supabase，請稍候...";
            statusText.style.color = "#007bff";
            
            try {
                for (let i = 0; i < configs.length; i++) {
                    const config = configs[i];
                    const canvas = document.getElementById(config.id);
                    const blob = await canvasToBlobAsync(canvas);
                    const filename = `signed_${Date.now()}_page${i+1}.jpg`;

                    const { error: storageError } = await supabase.storage
                        .from('completed_forms')
                        .upload(filename, blob, {
                            cacheControl: '3600',
                            upsert: false
                        });

                    if (storageError) throw storageError;

                    const { data: publicUrlData } = supabase.storage
                        .from('completed_forms')
                        .getPublicUrl(filename);
                    
                    const fileUrl = publicUrlData.publicUrl;

                    const { error: dbError } = await supabase
                        .from('form_records')
                        .insert([
                            { file_name: filename, image_url: fileUrl }
                        ]);

                    if (dbError) throw dbError;
                }
                
                statusText.innerText = "✅ 儲存成功！資料已同步至 Supabase。";
                statusText.style.color = "green";

                setTimeout(() => {
                    clearCanvas();
                }, 2000);

            } catch (error) {
                console.error("Upload error:", error);
                statusText.innerText = "❌ 儲存失敗：" + error.message;
                statusText.style.color = "red";
            }
        }
    </script>
</body>
</html>
