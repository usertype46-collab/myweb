<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業輔助工具集 (字串 & 條碼) - 強化版</title>
    <!-- 引入條碼與 QRCode 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        /* 基礎樣式重置 */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: #475569; text-align: left; border-left: 4px solid #3b82f6; padding-left: 10px;}
        
        /* 面板共用區塊 */
        .panel {
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 30px; 
        }

        /* 字串產生器區塊 */
        .string-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .date-display {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            background: #e2e8f0;
            padding: 10px 15px;
            border-radius: 6px;
        }
        .dynamic-inputs {
            display: flex;
            gap: 10px;
        }
        .num-input {
            width: 80px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        .result-box {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            resize: vertical;
            background: #f8fafc;
            color: #1e293b;
            font-family: inherit;
        }
        .copy-btn { background: #8b5cf6; color: white; font-weight: bold; width: 100%; margin-bottom: 15px; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px;}
        .copy-btn:hover { background: #7c3aed; }

        /* 條碼控制面板區塊 */
        .control-panel { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            align-items: center;
        }
        input[type="text"], select, button { 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 16px; 
            transition: all 0.2s ease;
        }
        input[type="text"] { flex: 1; min-width: 200px; }
        select { background: #eee; outline: none; cursor: pointer; }
        button { cursor: pointer; border: none; }
        button.add-btn { background: #10b981; color: white; font-weight: bold; padding: 12px 20px;}
        button.add-btn:hover { background: #059669; }

        /* 卡片顯示區域 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; 
            margin-top: 20px;
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            animation: fadeIn 0.3s ease-in-out;
            border: 1px solid #e2e8f0;
        }
        .card canvas { max-width: 100%; height: auto; background: white; padding: 10px; border-radius: 4px; }
        .text-display { 
            word-break: break-all; 
            color: #666; 
            font-size: 0.95em; 
            text-align: center; 
            width: 100%;
            font-weight: bold;
        }
        
        /* 卡片內按鈕區塊 */
        .card-actions { display: flex; gap: 10px; width: 100%; }
        .btn-download { flex: 1; background: #3b82f6; color: white; padding: 10px; border-radius: 6px;}
        .btn-download:hover { background: #2563eb; }
        .btn-remove { flex: 1; background: #ef4444; color: white; padding: 10px; border-radius: 6px;}
        .btn-remove:hover { background: #dc2626; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>作業輔助工具集</h1>
        
        <!-- 字串複製產生器區塊 -->
        <div class="panel">
            <h2>回報字串產生器</h2>
            <div class="string-row">
                <div class="date-display" id="todayDate"></div>
                <select id="locationSelect">
                    <option value="潮州中洲">潮州中洲</option>
                    <option value="潮州光華">潮州光華</option>
                    <option value="潮州大同">潮州大同</option>
                    <option value="潮州光春">潮州光春</option>
                    <option value="潮州愛國">潮州愛國</option>
                    <option value="潮州四維">潮州四維</option>
                    <option value="潮州文化">潮州文化</option>
                    <option value="潮州延平">潮州延平</option>
                    <option value="潮州太平">潮州太平</option>
                    <option value="潮州新生">潮州新生</option>
                </select>
            </div>
            <div class="string-row">
                <select id="status1" onchange="renderDynamicInputs('status1', 'dynamic1')">
                    <option value="none">無</option>
                    <option value="stay_box">滯留（手動輸入）箱</option>
                    <option value="stay_box_naked">滯留（手動輸入）箱（手動輸入）裸</option>
                    <option value="no_stay">無滯留</option>
                    <option value="no_arrival">無到貨</option>
                    <option value="no_cabinet">無櫃位</option>
                    <option value="no_suitable">無合適櫃位</option>
                    <option value="strap">束帶×（手動輸入）</option>
                    <option value="no_strap">無束帶×（手動輸入）</option>
                </select>
                <div id="dynamic1" class="dynamic-inputs"></div>
            </div>
            <div class="string-row">
                <select id="status2" onchange="renderDynamicInputs('status2', 'dynamic2')">
                    <option value="none">無</option>
                    <option value="stay_box">滯留（手動輸入）箱</option>
                    <option value="stay_box_naked">滯留（手動輸入）箱（手動輸入）裸</option>
                    <option value="no_stay">無滯留</option>
                    <option value="no_arrival">無到貨</option>
                    <option value="no_cabinet">無櫃位</option>
                    <option value="no_suitable">無合適櫃位</option>
                    <option value="strap">束帶×（手動輸入）</option>
                    <option value="no_strap">無束帶×（手動輸入）</option>
                </select>
                <div id="dynamic2" class="dynamic-inputs"></div>
            </div>
            <button class="copy-btn" onclick="generateAndCopyString()">產生並複製字串</button>
            <textarea id="resultOutput" class="result-box" readonly placeholder="產生的結果會顯示在這裡..."></textarea>
        </div>

        <!-- 條碼與 QR Code 產生器區塊 -->
        <div class="panel">
            <h2>條碼 & QR Code 產生器 (強化版)</h2>
            <div class="control-panel">
                <input type="text" id="inputValue" placeholder="請輸入數值 (例如: SPX30657)..." />
                
                <select id="codeType" onchange="toggleAdvancedOptions()">
                    <option value="qrcode">QR Code</option>
                    <option value="barcode">條碼 (Barcode)</option>
                </select>

                <!-- 條碼專屬進階選項 -->
                <select id="barcodeFormat" style="display: none;">
                    <option value="CODE128">CODE128 (支援大小寫英數)</option>
                    <option value="CODE39">CODE39 (僅支援大寫英數)</option>
                </select>

                <!-- QRCode 專屬進階選項 -->
                <select id="qrErrorLevel" style="display: inline-block;">
                    <option value="M">容錯率: 一般 (M)</option>
                    <option value="H">容錯率: 高 (H - 適合防遮擋)</option>
                </select>

                <button class="add-btn" onclick="generateCode()">產生圖片</button>
            </div>
            <div class="grid" id="codeGrid"></div>
        </div>
    </div>

    <script>
        /* ================= 字串產生器邏輯 (維持原樣) ================= */
        const today = new Date();
        const dateString = `${today.getMonth() + 1}/${today.getDate()}`;
        document.getElementById('todayDate').textContent = dateString;

        function renderDynamicInputs(selectId, dynamicContainerId) {
            const selectVal = document.getElementById(selectId).value;
            const container = document.getElementById(dynamicContainerId);
            container.innerHTML = '';
            if (selectVal === 'stay_box') {
                container.innerHTML = `<input type="number" id="${selectId}_v1" class="num-input" placeholder="箱數" min="0">`;
            } else if (selectVal === 'stay_box_naked') {
                container.innerHTML = `
                    <input type="number" id="${selectId}_v1" class="num-input" placeholder="箱數" min="0">
                    <input type="number" id="${selectId}_v2" class="num-input" placeholder="裸數" min="0">`;
            } else if (selectVal === 'strap' || selectVal === 'no_strap') {
                container.innerHTML = `<input type="number" id="${selectId}_v1" class="num-input" placeholder="數量" min="0">`;
            }
        }

        function getLineContent(selectId) {
            const val = document.getElementById(selectId).value;
            if (val === 'none') return '';
            const v1 = document.getElementById(`${selectId}_v1`) ? (document.getElementById(`${selectId}_v1`).value || '0') : '0';
            const v2 = document.getElementById(`${selectId}_v2`) ? (document.getElementById(`${selectId}_v2`).value || '0') : '0';

            switch(val) {
                case 'stay_box': return `滯留${v1}箱`;
                case 'stay_box_naked': return `滯留${v1}箱${v2}裸`;
                case 'no_stay': return '無滯留';
                case 'no_arrival': return '無到貨';
                case 'no_cabinet': return '無櫃位';
                case 'no_suitable': return '無合適櫃位';
                case 'strap': return `束帶×${v1}`;
                case 'no_strap': return `無束帶×${v1}`;
                default: return '';
            }
        }

        function generateAndCopyString() {
            const location = document.getElementById('locationSelect').value;
            const line1 = `${dateString} ${location}`;
            const line2 = getLineContent('status1');
            const line3 = getLineContent('status2');
            const resultLines = [line1];
            if (line2 !== '') resultLines.push(line2);
            if (line3 !== '') resultLines.push(line3);
            const finalString = resultLines.join('\n');
            document.getElementById('resultOutput').value = finalString;

            navigator.clipboard.writeText(finalString).then(() => {
                alert('✅ 字串已成功複製！\n\n' + finalString);
            }).catch(err => {
                alert('❌ 複製失敗，請手動選取下方文字框的內容進行複製。');
            });
        }

        /* ================= 條碼 & QR Code 強化邏輯 ================= */
        
        // 切換進階選項的顯示狀態
        function toggleAdvancedOptions() {
            const type = document.getElementById('codeType').value;
            document.getElementById('barcodeFormat').style.display = type === 'barcode' ? 'inline-block' : 'none';
            document.getElementById('qrErrorLevel').style.display = type === 'qrcode' ? 'inline-block' : 'none';
        }

        async function generateCode() {
            const inputField = document.getElementById('inputValue');
            let rawInput = inputField.value.trim();
            const type = document.getElementById('codeType').value;

            if (!rawInput) {
                alert('⚠️ 請先輸入數值！');
                return;
            }

            // 淨化輸入字串：移除可能導致渲染失敗的零寬度空白字元
            const safeInput = rawInput.replace(/[\u200B-\u200D\uFEFF]/g, '');

            const grid = document.getElementById('codeGrid');
            const card = document.createElement('div');
            card.className = 'card';
            const canvas = document.createElement('canvas');

            try {
                if (type === 'barcode') {
                    const format = document.getElementById('barcodeFormat').value;
                    JsBarcode(canvas, safeInput, { 
                        format: format, 
                        width: 2, 
                        height: 60, 
                        displayValue: false, 
                        margin: 10 // 增加邊界讓掃描器更好抓取
                    });
                } else if (type === 'qrcode') {
                    const errorLevel = document.getElementById('qrErrorLevel').value;
                    await QRCode.toCanvas(canvas, safeInput, { 
                        width: 180, 
                        margin: 2, // 適度留白
                        errorCorrectionLevel: errorLevel 
                    });
                }
            } catch (e) {
                console.error("生成元件時發生錯誤:", e);
                // 根據錯誤類型提供精準回饋，不再寫死錯誤訊息
                if (type === 'barcode') {
                    alert(`❌ 條碼產生失敗！\n\n【原因】您輸入的內容可能不支援目前的條碼格式。\n目前選擇格式: ${document.getElementById('barcodeFormat').value}\n系統訊息: ${e.message || e}`);
                } else {
                    alert(`❌ QR Code 產生失敗！\n\n系統訊息: ${e.message || e}`);
                }
                return; // 發生錯誤即停止，不把壞掉的卡片加入畫面
            }

            const textDisplay = document.createElement('div');
            textDisplay.className = 'text-display';
            textDisplay.textContent = safeInput;

            const actions = document.createElement('div');
            actions.className = 'card-actions';

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'btn-download';
            downloadBtn.textContent = '下載圖片';
            downloadBtn.onclick = () => downloadImage(canvas, safeInput, type);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn-remove';
            removeBtn.textContent = '移除';
            removeBtn.onclick = () => card.remove();

            actions.appendChild(downloadBtn);
            actions.appendChild(removeBtn);
            card.appendChild(canvas);
            card.appendChild(textDisplay);
            card.appendChild(actions);

            grid.prepend(card); 
            inputField.value = ''; // 成功後清空輸入框方便下一次輸入
        }

        function downloadImage(canvas, text, type) {
            const url = canvas.toDataURL("image/png");
            const a = document.createElement('a');
            a.href = url;
            const safeName = text.replace(/[^a-zA-Z0-9]/gi, '_').substring(0, 15);
            a.download = `${type}_${safeName || 'image'}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
